name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/dev.db
      ADMIN_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: Схема БД
        run: npx prisma db push

      - name: Линт
        run: npm run lint

      - name: Сборка
        run: npm run build

      - name: Smoke-тест ключевых страниц
        run: |
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          for page in / /services /doctors /book /contacts /login /privacy /offer /license; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$page")
            echo "$page → $code"
            [ "$code" = "200" ] || exit 1
          done
          kill $SERVER_PID
